# azure.yaml — azd project manifest
# https://learn.microsoft.com/azure/developer/azure-developer-cli/azd-schema
name: dashboard-educativo
metadata:
  template: dashboard-educativo@0.0.1

# Infrastructure location
infra:
  provider: bicep
  path: infra
  module: main
  resourceGroup: RG_UADE_INNOVA_DEV

# Application services
services:
  frontend:
    project: ./frontend/dist
    language: js
    host: staticwebapp         # Azure Static Web Apps — sin VM quota, CDN global

  backend:
    project: ./backend
    language: js
    host: function

hooks:
  prepackage:
    # Generate .env for Vite build based on azd environment variables
    shell: sh
    run: |
      echo "VITE_API_BASE_URL=$AZURE_FUNCTION_APP_URI/api" > ./frontend/.env
      echo "VITE_AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT" >> ./frontend/.env
      echo "VITE_AZURE_OPENAI_CHAT_DEPLOYMENT=$AZURE_OPENAI_CHAT_DEPLOYMENT" >> ./frontend/.env
      echo "VITE_AZURE_OPENAI_EMBEDDING_DEPLOYMENT=$AZURE_OPENAI_EMBEDDING_DEPLOYMENT" >> ./frontend/.env
      cd frontend && npm install && npm run build
