name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
  AZURE_DEV_COLLECT_TELEMETRY: no

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          MISSING=""
          for secret in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ENV_NAME AZURE_LOCATION; do
            if [ -z "${!secret}" ]; then
              MISSING="$MISSING $secret"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          echo "All required secrets are present"

  deploy:
    needs: secrets-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Production
        run: azd deploy --no-prompt
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to settle
        run: sleep 30
      - name: Smoke test Functions
        run: |
          FUNC_URL="https://func-dashboard-ingest-q47bia47kk3na.azurewebsites.net/api/hello"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FUNC_URL" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Production health check returned $STATUS"
            exit 1
          fi
          echo "Production health check passed ($STATUS)"
