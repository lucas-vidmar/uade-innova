# ──────────────────────────────────────────────────────────────────
# Production Deployment — Deploys on push to main (PR merge)
# Uses SWA deployment token + Function App publish profile
# (no Azure RBAC / OIDC required)
#
# ⚠ TODO: Migrate to OIDC + azd when RBAC permissions are granted
#   (see AGENTS.md section 15)
# ──────────────────────────────────────────────────────────────────

name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: func-dashboard-ingest-q47bia47kk3na
  AZURE_STATIC_WEB_APP_NAME: stapp-dashboard-q47bia47kk3na

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          FUNC_PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          MISSING=""
          [ -z "$SWA_TOKEN" ] && MISSING="$MISSING AZURE_STATIC_WEB_APPS_API_TOKEN"
          [ -z "$FUNC_PUBLISH_PROFILE" ] && MISSING="$MISSING AZURE_FUNCTIONAPP_PUBLISH_PROFILE"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          echo "All required secrets are present"

  backend-tests:
    needs: secrets-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run backend unit tests
        run: npm test

  frontend-tests:
    needs: secrets-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Playwright E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-production
          path: frontend/test-results/
          retention-days: 7

  deploy:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist

      - name: Setup Node.js for backend deploy
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Deploy Backend to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to settle
        run: sleep 30
      - name: Smoke test Functions endpoint
        run: |
          FUNC_URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/hello"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FUNC_URL" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Production health check returned $STATUS"
            exit 1
          fi
          echo "Production health check passed ($STATUS)"
