name: Deploy to Staging

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
  AZURE_DEV_COLLECT_TELEMETRY: no

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          MISSING=""
          for secret in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ENV_NAME AZURE_LOCATION; do
            if [ -z "${!secret}" ]; then
              MISSING="$MISSING $secret"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          echo "All required secrets are present"

  backend-tests:
    needs: secrets-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run backend unit tests
        run: npm test

  frontend-tests:
    needs: secrets-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Playwright E2E tests (local dev server)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-staging
          path: frontend/test-results/
          retention-days: 7

  deploy:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure
        run: azd deploy --no-prompt
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}

  staging-health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to settle
        run: sleep 30
      - name: Check Functions health endpoint
        run: |
          FUNC_URL="https://func-dashboard-ingest-q47bia47kk3na.azurewebsites.net/api/hello"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FUNC_URL" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Functions health check returned $STATUS"
            exit 1
          fi
          echo "Functions health check passed ($STATUS)"

  create-pr:
    needs: staging-health-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check if PR already exists
        id: pr_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list --base main --head staging --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PR already exists, skipping creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create PR to main
        if: steps.pr_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head staging \
            --title "Staging to Main: ${{ github.event.head_commit.message }}" \
            --body "## Staging Deployment Summary

All checks passed:
- Backend unit tests: ✅
- Playwright E2E tests: ✅
- Azure deployment: ✅
- Health check: ✅

**Commit:** ${{ github.sha }}
**Author:** ${{ github.actor }}

A human must review and approve before merging to production."
