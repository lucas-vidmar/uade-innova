name: Staging

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  AZURE_FUNCTIONAPP_NAME: func-dashboard-ingest-q47bia47kk3na
  AZURE_STATIC_WEB_APP_NAME: stapp-dashboard-q47bia47kk3na
  SMOKE_SWA_URL: ${{ secrets.SMOKE_SWA_URL }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          SMOKE_SWA_URL: ${{ secrets.SMOKE_SWA_URL }}
          SMOKE_AUTH_ENABLED: ${{ secrets.SMOKE_AUTH_ENABLED }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_CLIENT_ID: ${{ secrets.SMOKE_TEST_CLIENT_ID }}
          SMOKE_TEST_CLIENT_SECRET: ${{ secrets.SMOKE_TEST_CLIENT_SECRET }}
          RAG_CANARY_ENABLED: ${{ secrets.RAG_CANARY_ENABLED }}
          RAG_CANARY_FUNCTION_URL: ${{ secrets.RAG_CANARY_FUNCTION_URL }}
          RAG_CANARY_FRONT_DOOR_ID: ${{ secrets.RAG_CANARY_FRONT_DOOR_ID }}
          RAG_CANARY_STUDENT_EMAIL: ${{ secrets.RAG_CANARY_STUDENT_EMAIL }}
          RAG_CANARY_TEACHER_EMAIL: ${{ secrets.RAG_CANARY_TEACHER_EMAIL }}
          RAG_CANARY_DIRECTOR_EMAIL: ${{ secrets.RAG_CANARY_DIRECTOR_EMAIL }}
          RAG_CANARY_ADMIN_EMAIL: ${{ secrets.RAG_CANARY_ADMIN_EMAIL }}
          SMOKE_ALLOWLIST_ENABLED: ${{ secrets.SMOKE_ALLOWLIST_ENABLED }}
          SMOKE_BROWSER_CHECK: ${{ secrets.SMOKE_BROWSER_CHECK }}
          SMOKE_STUDENT_EMAIL: ${{ secrets.SMOKE_STUDENT_EMAIL }}
          SMOKE_STUDENT_PASSWORD: ${{ secrets.SMOKE_STUDENT_PASSWORD }}
          SMOKE_TEACHER_EMAIL: ${{ secrets.SMOKE_TEACHER_EMAIL }}
          SMOKE_TEACHER_PASSWORD: ${{ secrets.SMOKE_TEACHER_PASSWORD }}
          SMOKE_DIRECTOR_EMAIL: ${{ secrets.SMOKE_DIRECTOR_EMAIL }}
          SMOKE_DIRECTOR_PASSWORD: ${{ secrets.SMOKE_DIRECTOR_PASSWORD }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_UNLISTED_EMAIL: ${{ secrets.SMOKE_UNLISTED_EMAIL }}
          SMOKE_UNLISTED_PASSWORD: ${{ secrets.SMOKE_UNLISTED_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$SWA_TOKEN" ] && MISSING="$MISSING AZURE_STATIC_WEB_APPS_API_TOKEN"
          [ -z "$SMOKE_SWA_URL" ] && MISSING="$MISSING SMOKE_SWA_URL"
          if [ "$SMOKE_AUTH_ENABLED" = "true" ]; then
            [ -z "$SMOKE_TEST_EMAIL" ] && MISSING="$MISSING SMOKE_TEST_EMAIL"
            [ -z "$SMOKE_TEST_CLIENT_ID" ] && [ -z "$SMOKE_TEST_CLIENT_SECRET" ] && MISSING="$MISSING SMOKE_TEST_CLIENT_ID/SMOKE_TEST_CLIENT_SECRET"
          fi
          # RAG source-isolation canary (Story 3.7 / #261): fail closed when
          # enabled but identity/secrets are missing (AC #3).
          if [ "$RAG_CANARY_ENABLED" = "true" ]; then
            [ -z "$RAG_CANARY_FUNCTION_URL" ] && MISSING="$MISSING RAG_CANARY_FUNCTION_URL"
            [ -z "$RAG_CANARY_FRONT_DOOR_ID" ] && MISSING="$MISSING RAG_CANARY_FRONT_DOOR_ID"
            [ -z "$RAG_CANARY_STUDENT_EMAIL" ] && MISSING="$MISSING RAG_CANARY_STUDENT_EMAIL"
            [ -z "$RAG_CANARY_TEACHER_EMAIL" ] && MISSING="$MISSING RAG_CANARY_TEACHER_EMAIL"
            [ -z "$RAG_CANARY_DIRECTOR_EMAIL" ] && MISSING="$MISSING RAG_CANARY_DIRECTOR_EMAIL"
            [ -z "$RAG_CANARY_ADMIN_EMAIL" ] && MISSING="$MISSING RAG_CANARY_ADMIN_EMAIL"
          fi
          # Story 10.25 per-role allowlist smoke identities — fail closed once enabled.
          if [ "$SMOKE_ALLOWLIST_ENABLED" = "true" ]; then
            for ROLE in STUDENT TEACHER DIRECTOR ADMIN; do
              [ -z "$(eval echo \${SMOKE_${ROLE}_EMAIL})" ] && MISSING="$MISSING SMOKE_${ROLE}_EMAIL"
            done
            [ -z "$SMOKE_UNLISTED_EMAIL" ] && MISSING="$MISSING SMOKE_UNLISTED_EMAIL"
            if [ "$SMOKE_BROWSER_CHECK" = "true" ]; then
              for ROLE in STUDENT TEACHER DIRECTOR ADMIN; do
                [ -z "$(eval echo \${SMOKE_${ROLE}_PASSWORD})" ] && MISSING="$MISSING SMOKE_${ROLE}_PASSWORD"
              done
              [ -z "$SMOKE_UNLISTED_PASSWORD" ] && MISSING="$MISSING SMOKE_UNLISTED_PASSWORD"
            fi
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          echo "All required secrets are present"

  backend-tests:
    needs: secrets-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run backend unit tests
        run: npm test

  frontend-tests:
    needs: secrets-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Playwright E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-staging
          path: frontend/test-results/
          retention-days: 7

  deploy:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Backend via azd
        run: azd deploy backend
        env:
          AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to settle
        run: sleep 30
      - name: Check Functions health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/hello")
          # Since #218, /api/hello is auth-gated (401 = host up, identity required).
          echo "$STATUS" | grep -E "^(200|401|403)$"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js for application-state probe
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps (Playwright) when browser checks are enabled
        if: ${{ secrets.SMOKE_AUTH_ENABLED == 'true' || secrets.SMOKE_BROWSER_CHECK == 'true' }}
        working-directory: frontend
        run: npm ci
      - name: Run staging application-state probe (Story 10.20)
        env:
          SMOKE_SWA_URL: ${{ env.SMOKE_SWA_URL }}
          SMOKE_AUTH_ENABLED: ${{ secrets.SMOKE_AUTH_ENABLED }}
          SMOKE_BROWSER_CHECK: ${{ secrets.SMOKE_BROWSER_CHECK }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_CLIENT_ID: ${{ secrets.SMOKE_TEST_CLIENT_ID }}
          SMOKE_TEST_CLIENT_SECRET: ${{ secrets.SMOKE_TEST_CLIENT_SECRET }}
          SMOKE_TIMEOUT_MS: ${{ secrets.SMOKE_TIMEOUT_MS }}
        run: node backend/scripts/smoke-prod-application-state.js
      - name: Run RAG source-isolation canary (Story 3.7)
        env:
          RAG_CANARY_ENABLED: ${{ secrets.RAG_CANARY_ENABLED }}
          RAG_CANARY_FUNCTION_URL: ${{ secrets.RAG_CANARY_FUNCTION_URL }}
          RAG_CANARY_FRONT_DOOR_ID: ${{ secrets.RAG_CANARY_FRONT_DOOR_ID }}
          RAG_CANARY_SUBJECT_ID: ${{ secrets.RAG_CANARY_SUBJECT_ID }}
          RAG_CANARY_CLASS_IDS: ${{ secrets.RAG_CANARY_CLASS_IDS }}
          RAG_CANARY_QUESTION: ${{ secrets.RAG_CANARY_QUESTION }}
          RAG_CANARY_TIMEOUT_MS: ${{ secrets.RAG_CANARY_TIMEOUT_MS }}
          RAG_CANARY_STUDENT_EMAIL: ${{ secrets.RAG_CANARY_STUDENT_EMAIL }}
          RAG_CANARY_TEACHER_EMAIL: ${{ secrets.RAG_CANARY_TEACHER_EMAIL }}
          RAG_CANARY_DIRECTOR_EMAIL: ${{ secrets.RAG_CANARY_DIRECTOR_EMAIL }}
          RAG_CANARY_ADMIN_EMAIL: ${{ secrets.RAG_CANARY_ADMIN_EMAIL }}
          RAG_CANARY_STUDENT_SUBJECT_ID: ${{ secrets.RAG_CANARY_STUDENT_SUBJECT_ID }}
          RAG_CANARY_STUDENT_CLASS_IDS: ${{ secrets.RAG_CANARY_STUDENT_CLASS_IDS }}
          RAG_CANARY_STUDENT_QUESTION: ${{ secrets.RAG_CANARY_STUDENT_QUESTION }}
          RAG_CANARY_TEACHER_SUBJECT_ID: ${{ secrets.RAG_CANARY_TEACHER_SUBJECT_ID }}
          RAG_CANARY_TEACHER_CLASS_IDS: ${{ secrets.RAG_CANARY_TEACHER_CLASS_IDS }}
          RAG_CANARY_TEACHER_QUESTION: ${{ secrets.RAG_CANARY_TEACHER_QUESTION }}
          RAG_CANARY_DIRECTOR_SUBJECT_ID: ${{ secrets.RAG_CANARY_DIRECTOR_SUBJECT_ID }}
          RAG_CANARY_DIRECTOR_CLASS_IDS: ${{ secrets.RAG_CANARY_DIRECTOR_CLASS_IDS }}
          RAG_CANARY_DIRECTOR_QUESTION: ${{ secrets.RAG_CANARY_DIRECTOR_QUESTION }}
          RAG_CANARY_ADMIN_SUBJECT_ID: ${{ secrets.RAG_CANARY_ADMIN_SUBJECT_ID }}
          RAG_CANARY_ADMIN_CLASS_IDS: ${{ secrets.RAG_CANARY_ADMIN_CLASS_IDS }}
          RAG_CANARY_ADMIN_QUESTION: ${{ secrets.RAG_CANARY_ADMIN_QUESTION }}
        run: node backend/scripts/canary-rag-source-isolation.js
      - name: Run per-role allowlist smoke identities probe (Story 10.25)
        env:
          SMOKE_ALLOWLIST_ENABLED: ${{ secrets.SMOKE_ALLOWLIST_ENABLED }}
          SMOKE_FUNCTION_URL: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net
          SMOKE_SWA_URL: ${{ env.SMOKE_SWA_URL }}
          SMOKE_FRONT_DOOR_ID: ${{ secrets.SMOKE_FRONT_DOOR_ID }}
          SMOKE_BROWSER_CHECK: ${{ secrets.SMOKE_BROWSER_CHECK }}
          SMOKE_STUDENT_EMAIL: ${{ secrets.SMOKE_STUDENT_EMAIL }}
          SMOKE_STUDENT_PASSWORD: ${{ secrets.SMOKE_STUDENT_PASSWORD }}
          SMOKE_TEACHER_EMAIL: ${{ secrets.SMOKE_TEACHER_EMAIL }}
          SMOKE_TEACHER_PASSWORD: ${{ secrets.SMOKE_TEACHER_PASSWORD }}
          SMOKE_DIRECTOR_EMAIL: ${{ secrets.SMOKE_DIRECTOR_EMAIL }}
          SMOKE_DIRECTOR_PASSWORD: ${{ secrets.SMOKE_DIRECTOR_PASSWORD }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_UNLISTED_EMAIL: ${{ secrets.SMOKE_UNLISTED_EMAIL }}
          SMOKE_UNLISTED_PASSWORD: ${{ secrets.SMOKE_UNLISTED_PASSWORD }}
          SMOKE_TIMEOUT_MS: ${{ secrets.SMOKE_TIMEOUT_MS }}
        run: node backend/scripts/smoke-allowlist-identities.js

  create-pr:
    needs: health-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check if PR already exists
        id: pr_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr list --base main --head staging --state open --json number --jq 'length')" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create PR to main
        if: steps.pr_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head staging --title "Staging to Main" \
            --body "All checks passed."
